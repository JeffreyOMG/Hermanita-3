@keyframes pulse{50%{opacity:.4}}

details summary{cursor:pointer;font-weight:800;color:var(--gold)}
.lock{font-size:5rem;text-align:center}

.hb{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;text-align:center;line-height:1;font-size:clamp(2.5rem,13.5vw,4.4rem);margin:10px 0 4px;

@keyframes drop{from{transform:translateY(-120vh) rotate(-14deg)}to{transform:none}}

.el{left:7%;right:7%;top:8%;bottom:6%;z-index:2;border-radius:4px;background:#fff8e6 repeating-linear-gradient(0deg,transparent 0 14px,rgba(120,80,40,.15) 14px 15px);
display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:"Dancing Script","Segoe Script",cursive;font-weight:700;font-size:1.3rem;color:#a3224a;
animation:slide 1.2s 2s ease-in-out forwards;box-shadow:0 0 0 rgba(255,230,150,0)}
@keyframes slide{to{transform:translateY(-58%) scale(1.05);box-shadow:0 0 36px 8px rgba(255,230,150,.7)}}

<body>

<script>
/* ============ DATOS (verificados por script antes de generar el archivo) ============ */
const DATA = {"keyHash":2820579778961142,"stages":[{"title":"El código oculto","instr":"Resuelve las 9 operaciones. Cada resultado es una letra del abecedario (A=1, B=2, C=3… Z=26). Junta las letras en orden y descubre la palabra.","ops":["(8 − 5)","(4 − 3)","(15 + 5)","(8 + 4)","(3 × 3)","(12 + 8)","(10 × 2)","(15 ÷ 3)","(9 × 2)"],"hn":[3312428413867787,1495859527769326,7963519504194017,1010335796841577,2326347925536804,1821166264996529,3374329766676965,8910425576026674,4206805131911938],"hw":1607041342059039,"reveal":"¡Primer misterio resuelto! 🐱 Busca el lugar donde el gato hace sus necesidades. Allí te espera la siguiente pista."},{"title":"La memoria escondida","instr":"Resuelve las 10 operaciones y convierte cada resultado en letra (A=1 … Z=26). ¿Qué palabra se forma?","ops":["(6 ÷ 3)","(3 × 3)","(8 ÷ 4)","(3 × 4)","(27 ÷ 3)","(45 ÷ 3)","(4 × 5)","(15 ÷ 3)","(9 ÷ 3)","(5 − 4)"],"hn":[8397875735559424,3838558980202976,1726499545848356,7665514630207185,8697631610334834,5688630582008919,4587044093921774,2605775019180990,2925326418747067,1345105275648404],"hw":6176756462503492,"reveal":"¡Tu memoria te ha ayudado! 📚 Busca el rincón donde estaba la antigua biblioteca, frente al cuarto verde. Aunque la casa haya cambiado, tú recuerdas dónde estaba."},{"title":"El secreto del rincón","instr":"Resuelve las 6 operaciones, cambia cada número por su letra (A=1 … Z=26) y descubre la palabra.","ops":["(9 ÷ 3)","(6 × 2)","(5 × 3)","(38 ÷ 2)","(15 ÷ 3)","(4 × 5)"],"hn":[5634532766001108,1805580383966937,2689822231700806,6293443988512954,8085889387762194,5829906945533931],"hw":7819944961452145,"reveal":"¡Has recordado un secreto de tu infancia! 👕 Ve al rincón del armario donde solías esconderte cuando eras pequeña."},{"title":"El trono peludo","instr":"Solo tres operaciones. Convierte cada resultado en letra (A=1 … Z=26). ¡Miau!","ops":["(12 ÷ 4)","(9 − 8)","(5 × 4)"],"hn":[1817107696255453,3451851672679113,2976710183060767],"hw":5603465923103681,"reveal":"¡El rey de la casa te espera! 👑 Busca la camita del gato junto a la ventana de la sala. Desde su trono peludo vigila todos los chismes del vecindario."},{"title":"El gran misterio final","instr":"¡La prueba más difícil! Recuerda el orden de las operaciones: primero paréntesis, luego × y ÷, y al final + y −. Convierte cada resultado en letra (A=1 … Z=26).","ops":["(2 × 5) + 3","18 ÷ (2 + 7) − 1","4 × (2 + 3)","3 × (10 − 4)","2 × (5 − 1) + 1","7 + 36 ÷ 6","5 × (8 − 5)","50 ÷ 5 + 4","(20 − 2) ÷ 2","(8 + 2) × 3 ÷ 2"],"hn":[2878812359887429,5594469825648815,6157428479052881,2141866934310327,3277372169614603,2561754252734013,3842835709280741,108858743680011,4430681174759418,1844279492944026],"hw":2346904372178740,"reveal":"¡Lo lograste, detective! 💍 Busca la fotografía del día de una boda muy especial para esta familia. Examina ese recuerdo para encontrar tu último regalo."}]};

/* ============ CONFIGURACIÓN DE FECHAS (hora Colombia, UTC-5) ============ */
const OPENS_AT  = new Date("2026-10-11T00:00:00-05:00").getTime(); // el juego se abre
const DEADLINE  = new Date("2026-10-12T00:00:00-05:00").getTime(); // medianoche del 11 al 12
const KEY_HASH  = DATA.keyHash;
const LS = "mision11_progreso";

/* ============ UTILIDADES ============ */
function hash(str){ // hash simple (no es criptográfico; solo evita ver las respuestas a simple vista)
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const pad=n=>String(n).padStart(2,"0");
function loadDone(){ try{const v=parseInt(localStorage.getItem(LS),10);return v>=0&&v<=5?v:0}catch(e){return 0} }
function saveDone(n){ try{localStorage.setItem(LS,String(n))}catch(e){} }
if(location.search.includes("reset")){ try{localStorage.removeItem(LS);sessionStorage.removeItem("bypass")}catch(e){} history.replaceState(null,"",location.pathname); }
let done=loadDone();
let bypass=false; try{bypass=sessionStorage.getItem("bypass")==="1"}catch(e){}
const isOpen=()=>bypass||Date.now()>=OPENS_AT;

/* ============ FONDO DE ESTRELLAS ============ */
(function(){const s=$("#stars");for(let i=0;i<40;i++){const d=document.createElement("div");d.className="star";
d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";d.style.animationDelay=Math.random()*3+"s";s.appendChild(d)}})();

/* ============ CONTADOR ============ */
let tick=null;
function parts(ms){const s=Math.max(0,Math.floor(ms/1000));return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
function unitsHTML(id){return `<div class="units" id="${id}"><div class="u"><b>--</b><span>días</span></div><div class="u"><b>--</b><span>horas</span></div><div class="u"><b>--</b><span>min</span></div><div class="u"><b>--</b><span>seg</span></div></div>`}
function fillUnits(id,ms){const p=parts(ms);const b=document.querySelectorAll(`#${id} b`);if(b.length===4){b[0].textContent=pad(p.d);b[1].textContent=pad(p.h);b[2].textContent=pad(p.m);b[3].textContent=pad(p.s)}}
function startTick(fn){clearInterval(tick);fn();tick=setInterval(fn,1000)}

/* ============ PANTALLA BLOQUEADA (antes del 11 de octubre) ============ */
function renderLocked(){
  app.innerHTML=`
  <div class="card center">
    <div class="envelope" id="lk" style="user-select:none;-webkit-user-select:none;touch-action:manipulation">🔒</div>
    <h1>Un gran regalo misterioso se está preparando…</h1>
    <p class="soft">Algo muy especial te espera, pero todavía no es el momento. La aventura se abrirá el <b>11 de octubre</b> a las 12:00 a. m.</p>
    ${unitsHTML("cdOpen")}
    <p class="small soft">⏳ Falta muy poquito…</p>
  </div>
  <div class="card center hidden" id="keyCard">
    <div id="keyBox">
      <input id="keyIn" type="password" placeholder="Escribe la clave" autocomplete="off" style="width:100%">
      <div class="msg" id="keyMsg"></div>
      <button id="keyGo">Entrar</button>
    </div>
  </div>`;
  let taps=0,tm;
  $("#lk").onclick=()=>{taps++;clearTimeout(tm);tm=setTimeout(()=>{taps=0},2500);if(taps>=5){taps=0;$("#keyCard").classList.remove("hidden");$("#keyIn").focus()}}; // acceso secreto: 5 toques al candado
  const go=()=>{
    if(hash($("#keyIn").value.trim())===KEY_HASH){
      bypass=true;try{sessionStorage.setItem("bypass","1")}catch(e){}
      route();
    }else{$("#keyMsg").textContent="Clave incorrecta.";$("#keyMsg").className="msg bad"}
  };
  $("#keyGo").onclick=go;
  $("#keyIn").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  startTick(()=>{ if(isOpen()){route();return} updateMini(); fillUnits("cdOpen",OPENS_AT-Date.now()) });
}

/* ============ BARRA SUPERIOR: CONTADOR + PROGRESO ============ */
function topHTML(current,big){
  let bars="";for(let i=0;i<5;i++){bars+=`<i class="${i<done?"done":i===current?"now":""}"></i>`}
  return `
  ${big?`<div class="card timer" id="timerCard">
    <div class="t" id="tTitle">⏳ ¡El regalo tiene una fecha límite!</div>
    ${unitsHTML("cdLimit")}
    <div class="small soft" id="tMsg">El regalo está reservado para ti… pero el reloj no se detiene. ¡Descubre el misterio antes de que llegue la medianoche!</div>
  </div>`:""}
  <div class="topbar"><span class="small soft">Etapa ${Math.min(done+1,5)} de 5 · ${done} completadas</span>
  <button class="ghost" id="clues">🗂️ Mis pistas</button></div>
  <div class="progress">${bars}</div>`;
}
function updateMini(){
  const m=$("#mini");if(!m)return;
  const show=isOpen()&&!$("#start")&&!$("#keyIn");
  m.classList.toggle("hidden",!show);document.body.classList.toggle("hasmini",show);
  const left=DEADLINE-Date.now(),p=parts(left);
  m.textContent=left<=0?"🌙 ¡Sonaron las campanadas de medianoche! La búsqueda sigue abierta":`⏳ ${p.d?p.d+"d ":""}${pad(p.h)}:${pad(p.m)}:${pad(p.s)} · el regalo vence a medianoche`;
}
function bindTop(){
  const c=$("#clues"); if(c) c.onclick=renderReview;
  startTick(()=>{
    updateMini();
    const left=DEADLINE-Date.now(); const card=$("#timerCard"); if(!card)return;
    if(left<=0){
      card.classList.add("midnight");
      $("#tTitle").textContent="🌙 ¡Las campanadas de medianoche han sonado!";
      $("#tMsg").textContent="¿Lograste descubrir tu gran regalo misterioso? ¡No te preocupes, la búsqueda sigue abierta para ti!";
      fillUnits("cdLimit",0);
    }else fillUnits("cdLimit",left);
  });
}

function mas(k,s,cls){return `<span class="mas ${cls||""}" data-k="${k}" style="width:${s}px;height:${s}px"></span>`}
function hydrateMas(){
  document.querySelectorAll(".mas:not([data-h])").forEach(sp=>{
    sp.dataset.h=1;const k=sp.dataset.k;
    sp.innerHTML=IMG[k]?`<img src="${IMG[k]}" alt="">`:`<svg viewBox="0 0 100 100">${MS[k]}</svg>`;  // imágenes incluidas dentro del mismo archivo
  });
}

/* ============ BIENVENIDA (cuando se abre el juego) ============ */
const ITEMS=["🎈","🎈","🎈","🎈","🦄","🦄","🌈","🎀","✨","🧁","🎂","💖","⭐"];
function spawn(init){
  const f=$("#fall");if(!f||f.children.length>36)return;
  const s=document.createElement("span"),it=ITEMS[Math.floor(Math.random()*ITEMS.length)],d=6+Math.random()*6;
  s.textContent=it;
  const side=$("#fwFlag")?Math.random()*92:(Math.random()<.5?Math.random()*8:88+Math.random()*8);
  s.style.cssText=`left:${side}%;--s:${24+Math.random()*34}px;--d:${d}s;--sx:${(Math.random()-.5)*90}px;--r:${(Math.random()-.5)*30}deg;`
    +(it==="🎈"?`filter:hue-rotate(${Math.floor(Math.random()*360)}deg);`:"")+(init?`animation-delay:-${Math.random()*d*.9}s;`:"");
  s.addEventListener("animationend",()=>s.remove());f.appendChild(s);
}
let fwRun=false;
function startFW(){
  if(fwRun)return;fwRun=true;
  const cv=$("#fw"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;let ps=[];
  (function loop(){
    if(!$("#fwFlag")){x.clearRect(0,0,cv.width,cv.height);fwRun=false;return}
    x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.18)";x.fillRect(0,0,cv.width,cv.height);x.globalCompositeOperation="lighter";
    if(Math.random()<.05){const bx=cv.width*(.1+Math.random()*.8),by=cv.height*(.1+Math.random()*.4),h=Math.random()*360;
      for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=1.5+Math.random()*3;ps.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:70,h})}}
    ps=ps.filter(p=>p.l>0);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.vx*=.99;p.l--;x.fillStyle=`hsla(${p.h},100%,65%,${p.l/70})`;x.beginPath();x.arc(p.x,p.y,2.2,0,6.3);x.fill()});
    requestAnimationFrame(loop);
  })();
}

  <div class="hb">¡FELIZ CUMPLEAÑOS!</div>
  <p class="center" style="font-size:1.3rem;font-weight:800;margin:4px 0 14px">🎉 número 11 🎉</p>

function flower(s,c1,c2,stem){
  let p="";for(let i=0;i<5;i++)p+=`<ellipse cx="50" cy="27" rx="17" ry="25" fill="${c1}" opacity=".92" transform="rotate(${i*72} 50 50)"/>`;
  const st=stem?`<path d="M50 60 C44 90 30 110 18 130" stroke="#4f7d3b" stroke-width="4" fill="none"/><ellipse cx="34" cy="100" rx="14" ry="6" fill="#6aa04f" transform="rotate(-35 34 100)"/>`:"";
  return `<svg class="fl ${stem?"bl":"tr"}" viewBox="0 0 100 ${stem?135:100}" width="${s}">${st}${p}<circle cx="50" cy="50" r="9" fill="${c2}"/><circle cx="46" cy="47" r="2" fill="#fff" opacity=".7"/></svg>`;
}
const STAMP=`<svg class="fl st" viewBox="0 0 100 100" width="92"><circle cx="50" cy="50" r="44" fill="none" stroke="#d6558f" stroke-width="3"/><circle cx="50" cy="50" r="37" fill="none" stroke="#d6558f" stroke-width="1.5"/><text x="50" y="35" font-size="13" text-anchor="middle" fill="#d6558f">♥ ♥ ♥</text><text x="50" y="55" font-size="12" text-anchor="middle" fill="#d6558f" font-family="Special Elite,monospace" transform="rotate(-8 50 50)">TE QUIERO</text><text x="50" y="76" font-size="13" text-anchor="middle" fill="#d6558f">♥ ♥ ♥</text></svg>`;
function letterHTML(){return `
<div class="sheetw"><div class="news"><div class="mast">La Gaceta del Cariño</div>
<div class="sheet" id="sheet">${flower(104,"#f4a6c6","#c2417a")}${flower(120,"#f7b5cf","#d65b93",true)}${STAMP}
<p class="ttl">Para mi linda hermanita de mi corazón, feliz cumpleaños número 11. ❤️</p>
<p>Mi linda hermanita, quiero que hoy recuerdes lo especial que eres para mí. Eres una niña hermosa, inteligente, curiosa y llena de creatividad. Me encanta verte crecer, descubrir el mundo a tu manera y convertirte, poco a poco, en una personita increíble.</p>
<p>Quiero que nunca olvides que no tienes que ser perfecta para brillar. Puedes equivocarte, cambiar de opinión y volver a intentarlo. Espero que siempre te mires con el mismo cariño con el que yo te veo, porque vales muchísimo, incluso en esos días en los que tú misma no logras darte cuenta.</p>
<p>Aunque a veces no te lo diga o no siempre encuentre la manera de demostrarlo, quiero que sepas que te amo muchísimo. Para mí, eres alguien demasiado especial. Me hace feliz compartir momentos contigo, verte sonreír y acompañarte mientras creces. Siempre voy a desear que seas feliz, que cumplas tus sueños y que nunca dudes de lo mucho que vales.</p>
<p>Hoy preparé algo especial para ti, porque quería regalarte algo diferente, algo que no fuera solamente un objeto, sino una experiencia bonita que pudieras recordar con una sonrisa.</p>
<p class="ps">P. D.: No es un tocador, hermanita &lt;3, pero créeme que es un regalo muy especial. Tal vez no sea lo que imaginabas, pero tiene algo que vale mucho más: todo el amor, el tiempo y la ilusión con los que lo preparé para ti.</p>
<p>Feliz cumpleaños, mi linda hermanita de mi corazón. Nunca olvides lo mucho que te quiero y lo feliz que me hace tenerte en mi vida. Espero que hoy sonrías muchísimo y que este nuevo año esté lleno de momentos bonitos para ti.</p>
<p class="sig">Con todo mi amor, tu hermano. &lt;3</p>
</div></div></div>`}
function styleLetter(){ // borde inferior roto, como papel rasgado

}

let letterOpen=false;
function renderStage(n){
  const st=DATA.stages[n];
  let rows="";
  st.ops.forEach((op,i)=>{rows+=`<div class="row"><span class="n">${i+1}.</span><div class="op">${op}</div><span>=</span><input class="num" inputmode="numeric" pattern="[0-9]*" data-i="${i}" aria-label="Resultado ${i+1}"></div>`});
  let al="";for(let i=0;i<26;i++)al+=`<div><b>${String.fromCharCode(65+i)}</b> ${i+1}</div>`;
  app.innerHTML=`
  ${topHTML(n)}
  <div class="card pk">${mas(MK[n],58,"peek")}
    <p class="small soft" style="margin:0">Gran regalo misterioso · Paso ${n+1}</p>
    <h2>🔐 ${st.title}</h2>
    <p>${st.instr}</p>
    <details><summary>🔤 Ver el abecedario secreto</summary><div class="alpha">${al}</div></details>
    ${rows}
    <p style="margin-bottom:4px"><b>Escribe aquí la palabra descifrada:</b></p>
    <input class="word" id="word" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${"•".repeat(st.ops.length)}">
    <div class="msg" id="msg"></div>
    <button class="big" id="verify">Verificar código</button>
  </div>`;
  bindTop();
  const nums=[...document.querySelectorAll("input.num")];
  nums.forEach((inp,i)=>{
    inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,3);inp.classList.remove("bad")});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){(nums[i+1]||$("#word")).focus()}});
  });
  $("#word").addEventListener("input",()=>$("#word").classList.remove("bad"));
  $("#word").addEventListener("keydown",e=>{if(e.key==="Enter")verify(n)});
  $("#verify").onclick=()=>verify(n);
}
function normWord(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z]/g,"").toUpperCase()}
function verify(n){
  const st=DATA.stages[n]; const msg=$("#msg");
  const nums=[...document.querySelectorAll("input.num")]; const w=$("#word");
  const word=normWord(w.value);
  nums.forEach(i=>i.classList.remove("bad")); w.classList.remove("bad");
  if(nums.some(i=>i.value==="")||word===""){
    msg.className="msg bad";msg.textContent="Faltan casillas por completar. ¡Tú puedes, detective! 🔍";
    nums.forEach(i=>{if(i.value==="")i.classList.add("bad")}); if(word==="")w.classList.add("bad"); return;
  }
  let allOk=true;
  nums.forEach((inp,i)=>{ if(hash(`${n}|${i}|${parseInt(inp.value,10)}`)!==st.hn[i]){inp.classList.add("bad");allOk=false} });
  if(hash(`${n}|w|${word}`)!==st.hw){w.classList.add("bad");allOk=false}
  if(!allOk){msg.className="msg bad";msg.textContent="¡Casi, detective! Revisa las operaciones marcadas e inténtalo otra vez.";return}
  // Correcto
  if(n+1>done){done=n+1;saveDone(done)}
  renderReveal(n,true);
}

/* ============ REVELACIÓN ============ */
function renderReveal(n,animate){
  const st=DATA.stages[n];
  app.innerHTML=`
  ${topHTML(n+1<5?n+1:-1)}
  <div class="card center">
    <div class="lock ${animate?"open":""}">🔓</div>
    <h2>¡Código descifrado!</h2>
    <p>Has demostrado que eres una gran detective.</p>
  </div>
  <div class="card reveal center pk">${mas(MK[n],58,"peek")}
    <p class="small soft" style="margin:0">Tu siguiente destino</p>
    <p style="font-size:1.1rem">${st.reveal}</p>
  </div>
  <button class="big" id="next">Continuar</button>`;
  bindTop();
  if(animate)burst(60);
  $("#next").onclick=()=>{ if(n+1>=5) renderFinal(true); else { $("#next").disabled=true; route(true) } };
}
/* Nota: "Continuar" lleva a la siguiente etapa, pero la niña debe ir primero al lugar físico.
   Por eso, en la etapa siguiente la página mostrará el reto; ella puede dejarla abierta y
   escanear el QR del siguiente papel (que abre la misma página con su progreso guardado). */

/* ============ MIS PISTAS ============ */
function renderReview(){
  let list=`<div class="clue"><b>Inicio:</b> 🍽️ Tu primer acertijo te espera en el comedor.</div>`;

  if(!done) list+=`<p class="soft center">Aún no has descifrado ningún código. ¡Tú puedes!</p>`;
  app.innerHTML=`${topHTML(Math.min(done,4))}<div class="card"><h2>🗂️ Mis pistas descubiertas</h2>${list}</div>
  <button class="big" id="back">Volver</button><p></p><button class="big" id="rl" style="background:linear-gradient(135deg,#ffc2dd,#ff7eb6);box-shadow:0 5px 0 #b44a7f">💌 Releer mi carta</button>`;
  bindTop();
  $("#back").onclick=()=>route(true);
  $("#rl").onclick=renderLetterAgain;
}

/* ============ CONFETI (canvas ligero) ============ */
function burst(count){
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffd86b","#ff7eb6","#8be9fd","#b69cff","#6ee7a8","#fff"];
  const ps=[...Array(count)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(++f<220)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height)})();
}

/* ============ BOTÓN DE REINICIO (solo con la clave de prueba) ============ */
function updateReset(){ $("#resetBtn").classList.toggle("hidden",!bypass); }
$("#resetBtn").onclick=()=>{
  if(!confirm("¿Reiniciar todo el progreso?"))return;
  done=0;try{localStorage.removeItem(LS)}catch(e){}
  route();
};
/* ============ ENRUTADOR ============ */
function route(forceStage){
  window.scrollTo(0,0);
  updateReset();
  if(!isOpen()){renderLocked();return}
  if(done>=5){renderFinal(false);return}
  if(forceStage===true && done>=0){
    // tras "Continuar" o "Volver": mostrar la etapa actual
    renderStage(done);return;
  }
  if(done===0){renderIntro();return}
  // Recarga con progreso: mostrar la pista de la última etapa superada con opción de continuar
  renderReveal(done-1,false);
}
setInterval(()=>{ if(!isOpen())return; if($("#fwFlag")){spawn();spawn()}else if(Math.random()<.3)spawn() },550);
route();
</script>
