@keyframes pulse{50%{opacity:.4}}

details summary{cursor:pointer;font-weight:800;color:var(--gold)}
.lock{font-size:5rem;text-align:center}

.hb{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;text-align:center;line-height:1;font-size:clamp(2.5rem,13.5vw,4.4rem);margin:10px 0 4px;

@keyframes drop{from{transform:translateY(-120vh) rotate(-14deg)}to{transform:none}}

.el{left:7%;right:7%;top:8%;bottom:6%;z-index:2;border-radius:4px;background:#fff8e6 repeating-linear-gradient(0deg,transparent 0 14px,rgba(120,80,40,.15) 14px 15px);
display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:"Dancing Script","Segoe Script",cursive;font-weight:700;font-size:1.3rem;color:#a3224a;
animation:slide 1.2s 2s ease-in-out forwards;box-shadow:0 0 0 rgba(255,230,150,0)}
@keyframes slide{to{transform:translateY(-58%) scale(1.05);box-shadow:0 0 36px 8px rgba(255,230,150,.7)}}

<body>

<script>
/* ============ DATOS (verificados por script antes de generar el archivo) ============ */
const DATA = {"keyHash":2820579778961142,"stages":[{"title":"El código oculto","instr":"Resuelve las 9 operaciones. Cada resultado es una letra del abecedario (A=1, B=2, C=3… Z=26). Junta las letras en orden y descubre la palabra.","ops":["(8 − 5)","(4 − 3)","(15 + 5)","(8 + 4)","(3 × 3)","(12 + 8)","(10 × 2)","(15 ÷ 3)","(9 × 2)"],"hn":[3312428413867787,1495859527769326,7963519504194017,1010335796841577,2326347925536804,1821166264996529,3374329766676965,8910425576026674,4206805131911938],"hw":1607041342059039,"reveal":"¡Primer misterio resuelto! 🐱 Busca el lugar donde el gato hace sus necesidades. Allí te espera la siguiente pista."},{"title":"La memoria escondida","instr":"Resuelve las 10 operaciones y convierte cada resultado en letra (A=1 … Z=26). ¿Qué palabra se forma?","ops":["(6 ÷ 3)","(3 × 3)","(8 ÷ 4)","(3 × 4)","(27 ÷ 3)","(45 ÷ 3)","(4 × 5)","(15 ÷ 3)","(9 ÷ 3)","(5 − 4)"],"hn":[8397875735559424,3838558980202976,1726499545848356,7665514630207185,8697631610334834,5688630582008919,4587044093921774,2605775019180990,2925326418747067,1345105275648404],"hw":6176756462503492,"reveal":"¡Tu memoria te ha ayudado! 📚 Busca el rincón donde estaba la antigua biblioteca, frente al cuarto verde. Aunque la casa haya cambiado, tú recuerdas dónde estaba."},{"title":"El secreto del rincón","instr":"Resuelve las 6 operaciones, cambia cada número por su letra (A=1 … Z=26) y descubre la palabra.","ops":["(9 ÷ 3)","(6 × 2)","(5 × 3)","(38 ÷ 2)","(15 ÷ 3)","(4 × 5)"],"hn":[5634532766001108,1805580383966937,2689822231700806,6293443988512954,8085889387762194,5829906945533931],"hw":7819944961452145,"reveal":"¡Has recordado un secreto de tu infancia! 👕 Ve al rincón del armario donde solías esconderte cuando eras pequeña."},{"title":"El trono peludo","instr":"Solo tres operaciones. Convierte cada resultado en letra (A=1 … Z=26). ¡Miau!","ops":["(12 ÷ 4)","(9 − 8)","(5 × 4)"],"hn":[1817107696255453,3451851672679113,2976710183060767],"hw":5603465923103681,"reveal":"¡El rey de la casa te espera! 👑 Busca la camita del gato junto a la ventana de la sala. Desde su trono peludo vigila todos los chismes del vecindario."},{"title":"El gran misterio final","instr":"¡La prueba más difícil! Recuerda el orden de las operaciones: primero paréntesis, luego × y ÷, y al final + y −. Convierte cada resultado en letra (A=1 … Z=26).","ops":["(2 × 5) + 3","18 ÷ (2 + 7) − 1","4 × (2 + 3)","3 × (10 − 4)","2 × (5 − 1) + 1","7 + 36 ÷ 6","5 × (8 − 5)","50 ÷ 5 + 4","(20 − 2) ÷ 2","(8 + 2) × 3 ÷ 2"],"hn":[2878812359887429,5594469825648815,6157428479052881,2141866934310327,3277372169614603,2561754252734013,3842835709280741,108858743680011,4430681174759418,1844279492944026],"hw":2346904372178740,"reveal":"¡Lo lograste, detective! 💍 Busca la fotografía del día de una boda muy especial para esta familia. Examina ese recuerdo para encontrar tu último regalo."}]};

/* ============ CONFIGURACIÓN DE FECHAS (hora Colombia, UTC-5) ============ */
const OPENS_AT  = new Date("2026-10-11T00:00:00-05:00").getTime(); // el juego se abre
const DEADLINE  = new Date("2026-10-12T00:00:00-05:00").getTime(); // medianoche del 11 al 12
const KEY_HASH  = DATA.keyHash;
const LS = "mision11_progreso";

/* ============ UTILIDADES ============ */
function hash(str){ // hash simple (no es criptográfico; solo evita ver las respuestas a simple vista)
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const pad=n=>String(n).padStart(2,"0");
function loadDone(){ try{const v=parseInt(localStorage.getItem(LS),10);return v>=0&&v<=5?v:0}catch(e){return 0} }
function saveDone(n){ try{localStorage.setItem(LS,String(n))}catch(e){} }
if(location.search.includes("reset")){ try{localStorage.removeItem(LS);sessionStorage.removeItem("bypass")}catch(e){} history.replaceState(null,"",location.pathname); }
let done=loadDone();
let bypass=false; try{bypass=sessionStorage.getItem("bypass")==="1"}catch(e){}
const isOpen=()=>bypass||Date.now()>=OPENS_AT;

/* ============ FONDO DE ESTRELLAS ============ */
(function(){const s=$("#stars");for(let i=0;i<40;i++){const d=document.createElement("div");d.className="star";
d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";d.style.animationDelay=Math.random()*3+"s";s.appendChild(d)}})();

/* ============ CONTADOR ============ */
let tick=null;
function parts(ms){const s=Math.max(0,Math.floor(ms/1000));return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
function unitsHTML(id){return `<div class="units" id="${id}"><div class="u"><b>--</b><span>días</span></div><div class="u"><b>--</b><span>horas</span></div><div class="u"><b>--</b><span>min</span></div><div class="u"><b>--</b><span>seg</span></div></div>`}
function fillUnits(id,ms){const p=parts(ms);const b=document.querySelectorAll(`#${id} b`);if(b.length===4){b[0].textContent=pad(p.d);b[1].textContent=pad(p.h);b[2].textContent=pad(p.m);b[3].textContent=pad(p.s)}}
function startTick(fn){clearInterval(tick);fn();tick=setInterval(fn,1000)}

/* ============ PANTALLA BLOQUEADA (antes del 11 de octubre) ============ */
function renderLocked(){
  app.innerHTML=`
  <div class="card center">
    <div class="envelope" id="lk" style="user-select:none;-webkit-user-select:none;touch-action:manipulation">🔒</div>
    <h1>Un gran regalo misterioso se está preparando…</h1>
    <p class="soft">Algo muy especial te espera, pero todavía no es el momento. La aventura se abrirá el <b>11 de octubre</b> a las 12:00 a. m.</p>
    ${unitsHTML("cdOpen")}
    <p class="small soft">⏳ Falta muy poquito…</p>
  </div>
  <div class="card center hidden" id="keyCard">
    <div id="keyBox">
      <input id="keyIn" type="password" placeholder="Escribe la clave" autocomplete="off" style="width:100%">
      <div class="msg" id="keyMsg"></div>
      <button id="keyGo">Entrar</button>
    </div>

function normWord(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z]/g,"").toUpperCase()}
function verify(n){
  const st=DATA.stages[n]; const msg=$("#msg");
  const nums=[...document.querySelectorAll("input.num")]; const w=$("#word");
  const word=normWord(w.value);
  nums.forEach(i=>i.classList.remove("bad")); w.classList.remove("bad");
  if(nums.some(i=>i.value==="")||word===""){
    msg.className="msg bad";msg.textContent="Faltan casillas por completar. ¡Tú puedes, detective! 🔍";
    nums.forEach(i=>{if(i.value==="")i.classList.add("bad")}); if(word==="")w.classList.add("bad"); return;
  }
  let allOk=true;
  nums.forEach((inp,i)=>{ if(hash(`${n}|${i}|${parseInt(inp.value,10)}`)!==st.hn[i]){inp.classList.add("bad");allOk=false} });
  if(hash(`${n}|w|${word}`)!==st.hw){w.classList.add("bad");allOk=false}
  if(!allOk){msg.className="msg bad";msg.textContent="¡Casi, detective! Revisa las operaciones marcadas e inténtalo otra vez.";return}
  // Correcto
  if(n+1>done){done=n+1;saveDone(done)}
  renderReveal(n,true);
}

/* ============ CONFETI (canvas ligero) ============ */
function burst(count){
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffd86b","#ff7eb6","#8be9fd","#b69cff","#6ee7a8","#fff"];
  const ps=[...Array(count)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(++f<220)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height)})();
}

  window.scrollTo(0,0);
  updateReset();
  if(!isOpen()){renderLocked();return}
  if(done>=5){renderFinal(false);return}
  if(forceStage===true && done>=0){
    // tras "Continuar" o "Volver": mostrar la etapa actual
    renderStage(done);return;
  }
  if(done===0){renderIntro();return}
  // Recarga con progreso: mostrar la pista de la última etapa superada con opción de continuar
  renderReveal(done-1,false);
}
setInterval(()=>{ if(!isOpen())return; if($("#fwFlag")){spawn();spawn()}else if(Math.random()<.3)spawn() },550);
route();
</script>
